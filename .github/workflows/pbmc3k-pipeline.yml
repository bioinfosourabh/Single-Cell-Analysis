name: pbmc3k-pipeline

# Installs the R dependencies, downloads the 10x Genomics PBMC 3k matrix and
# runs the full workflow (steps 00-06) with config.yaml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pbmc3k:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "no"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libglpk-dev \
            libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev \
            libtiff-dev libjpeg-dev libfontconfig1-dev libcairo2-dev libhdf5-dev

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-${{ hashFiles('install_packages.R') }}
          restore-keys: rlib-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-

      - name: Cache reference data (celldex) and PBMC 3k
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/R
            data/pbmc3k
          key: refdata-${{ runner.os }}-v1

      - name: Install R packages
        run: Rscript install_packages.R

      - name: Run workflow on PBMC 3k
        run: Rscript run_pipeline.R --config config.yaml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbmc3k-results
          path: |
            results/figures
            results/tables
            results/logs
          if-no-files-found: warn
